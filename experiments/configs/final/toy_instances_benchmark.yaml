benchmark:
  n_repeats: 1
  max_time: 60
  instances:
    - '../../../instances/benchmarks/toy'
  output: 'outputs'
  solvers:
    - name: 'DFS'
      type: 'DFSSolver'
    - name: 'AStar - H1'
      type: AStarSolver
      hyperparameters:
        heuristic: 'h1'
    - name: 'AStar - H2'
      type: AStarSolver
      hyperparameters:
        heuristic: 'h2'
    - name: 'Tabu - n1'
      type: TabuSolver
      hyperparameters:
        neighbourhood: 'n1'
    - name: 'Tabu - n2'
      type: TabuSolver
      hyperparameters:
        neighbourhood: 'n2'
    - name: 'CSP'
      type: CSPSolver 
  seeds: [42]
