benchmark:
  n_repeats: 1
  max_time: 60
  instances:
    - '/Users/mau/Documents/Git/Job-Shop-Scheduling-Problem-JSP-/instances/benchmarks/toy' # To avoid problems, it's better to use full path
  output: '/Users/mau/Documents/Git/Job-Shop-Scheduling-Problem-JSP-/outputs'
  solvers:
    - name: 'DFS'
      type: 'DFSSolver'
    - name: 'AStar - H1'
      type: AStarSolver
      hyperparameters:
        heuristic: 'h1'
    - name: 'AStar - H2'
      type: AStarSolver
      hyperparameters:
        heuristic: 'h2'
    - name: 'Tabu - n1'
      type: TabuSolver
      hyperparameters:
        neighborhood: 'n1'
    - name: 'Tabu - n2'
      type: TabuSolver
      hyperparameters:
        neighborhood: 'n2'
    - name: 'CSP'
      type: CSPSolver 
  seeds: [42]