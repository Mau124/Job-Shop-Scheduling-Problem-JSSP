benchmark:
  n_repeats: 10
  max_time: 60
  instances:
    - '../../../instances/benchmarks/medium'
  output: 'outputs'
  solvers:
    - name: 'DFS'
      type: 'DFSSolver'
    - name: 'AStar - H1'
      type: AStarSolver
      hyperparameters:
        heuristic: 'h1'
    - name: 'AStar - H2'
      type: AStarSolver
      hyperparameters:
        heuristic: 'h2'
    - name: 'Tabu - n1'
      type: TabuSolver
      hyperparameters:
        neighbourhood: 'n1'
    - name: 'Tabu - n2'
      type: TabuSolver
      hyperparameters:
        neighbourhood: 'n2'
    - name: 'CSP'
      type: CSPSolver 
  seeds: [42, 100, 2026, 7, 19, 45, 23, 200, 9, 1]
